<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact NexusStore customer support.">
    <title>Contact Us | NStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-50 font-sans text-gray-800">
    <header class="bg-white shadow-sm">
        <div class="mx-auto flex min-h-16 max-w-5xl items-center justify-between px-4 sm:px-6">
            <a href="index.html" class="text-xl font-bold text-gray-900">MADHAN<span
                    class="text-blue-600">Store</span></a>
            <nav aria-label="Main navigation" class="flex gap-4 text-sm font-medium">
                <a href="feedback.html" class="text-blue-600 hover:text-blue-800">Feedback</a>
                <a href="index.html" class="text-blue-600 hover:text-blue-800">Back to store</a>
            </nav>
        </div>
    </header>
    <main class="mx-auto max-w-5xl px-4 py-12 sm:px-6">
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-900 sm:text-4xl">Contact Us</h1>
            <p class="mt-3 text-gray-600">Questions about an order or product? Send our team a message.</p>
        </div>
        <div class="grid gap-6 md:grid-cols-5">
            <section class="rounded-2xl border bg-white p-6 shadow-sm md:col-span-2">
                <h2 class="text-xl font-semibold text-gray-900">Get in touch</h2>
                <p class="mt-2 leading-relaxed text-gray-600">Our support team is ready to help.</p>
                <div class="mt-7">
                    <h3 class="font-semibold text-gray-900">Email support</h3>
                    <a class="mt-1 inline-block text-blue-600 hover:underline"
                        href="mailto:support@nexusstore.com">support@nexusstore.com</a>
                </div>
                <div class="mt-6">
                    <h3 class="font-semibold text-gray-900">Support hours</h3>
                    <p class="mt-1 text-gray-600">Monday–Friday, 9:00 AM–5:00 PM</p>
                </div>
            </section>
            <section class="rounded-2xl border bg-white p-6 shadow-sm md:col-span-3">
                <h2 class="text-xl font-semibold text-gray-900">Send a message</h2>
                <form id="contact-form" class="mt-5 space-y-4">
                    <div>
                        <label for="contact-name" class="block text-sm font-medium text-gray-700">Name</label>
                        <input id="contact-name" name="name" autocomplete="name" required maxlength="100"
                            class="mt-1 w-full rounded-lg border px-3 py-2 outline-none focus:ring-2 focus:ring-blue-400">
                    </div>
                    <div>
                        <label for="contact-email" class="block text-sm font-medium text-gray-700">Email</label>
                        <input id="contact-email" name="email" type="email" autocomplete="email" required
                            maxlength="254"
                            class="mt-1 w-full rounded-lg border px-3 py-2 outline-none focus:ring-2 focus:ring-blue-400">
                    </div>
                    <div>
                        <label for="contact-message" class="block text-sm font-medium text-gray-700">Message</label>
                        <textarea id="contact-message" name="message" rows="5" required maxlength="5000"
                            class="mt-1 w-full resize-y rounded-lg border px-3 py-2 outline-none focus:ring-2 focus:ring-blue-400"></textarea>
                    </div>
                    <button id="contact-submit" type="submit"
                        class="w-full rounded-lg bg-blue-600 px-4 py-3 font-semibold text-white hover:bg-blue-700 disabled:opacity-60">Send
                        Message</button>
                    <p id="contact-status" class="min-h-6 text-sm text-gray-600" role="status" aria-live="polite"></p>
                </form>
            </section>
        </div>
    </main>
    <footer class="py-6 text-center text-sm text-gray-500">&copy; <span id="year"></span> NexusStore.</footer>
    <script src="contact.js" defer></script>
</body>

</html>
